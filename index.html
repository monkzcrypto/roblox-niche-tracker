<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Niche Tracker</title>
<style>
:root{--bg:#0b0d12;--panel:#12151c;--panel2:#181c25;--line:#232836;--text:#e9ebf0;--dim:#8b92a3;
--accent:#4f8cff;--up:#2fd47a;--down:#ff5d6c;--gold:#ffb627}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
header{padding:20px 28px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.meta{color:var(--dim);font-size:12.5px;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.stat b{display:block;font-size:18px}
.stat small{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.bar{display:flex;gap:10px;align-items:center;padding:16px 28px;flex-wrap:wrap}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--dim);font-weight:600;font-size:13px;border:0;background:none}
.tab.on{background:var(--accent);color:#fff}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit}
input{width:240px}
main{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:0 28px 28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.12s}
.card:hover{border-color:#36405a;background:var(--panel2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row1{display:flex;align-items:center;gap:10px}
.rank{color:var(--dim);font-weight:700;width:22px;font-size:13px}
.lbl{font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccu{font-weight:750;font-variant-numeric:tabular-nums}
.row2{display:flex;align-items:center;gap:10px;margin-top:8px;padding-left:32px}
.icons{display:flex}
.icons img{width:26px;height:26px;border-radius:6px;border:2px solid var(--panel);margin-left:-6px;background:#222}
.icons img:first-child{margin-left:0}
.sub{color:var(--dim);font-size:12px;flex:1}
.pill{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.pill.up{background:rgba(47,212,122,.13);color:var(--up)} .pill.down{background:rgba(255,93,108,.13);color:var(--down)}
.pill.flat{background:#1d2230;color:var(--dim)}
.meter{height:4px;background:#1d2230;border-radius:3px;margin:8px 0 0 32px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8fb3ff)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:300px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.dh h2{margin:0;font-size:22px}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--panel2);border-radius:10px;padding:10px 12px}
.kpi b{font-size:18px;display:block} .kpi small{color:var(--dim);font-size:11.5px}
.hint{color:var(--dim);font-size:12px;margin:-6px 0 14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)} th.num,td.num{text-align:right}
td{padding:8px;border-bottom:1px solid #1a1e29;vertical-align:middle}
tr:hover td{background:#151924}
.gname{display:flex;align-items:center;gap:10px}
.gname img{width:38px;height:38px;border-radius:8px;background:#222;flex:none}
.gname a{color:var(--text);text-decoration:none;font-weight:600}
.gname a:hover{color:var(--accent)}
.tags{font-size:11px;color:var(--dim)}
.new{background:var(--gold);color:#000;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:6px}
.up{color:var(--up)} .down{color:var(--down)} .flatc{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:60px 0}
svg.spark{display:block}
tr.g{cursor:pointer}
tr.open td{background:#151924}
tr.more td{background:#0f121a;padding:0}
.more-in{display:flex;gap:18px;padding:16px;flex-wrap:wrap}
.more-in img.banner{width:380px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#222}
.more-txt{flex:1;min-width:260px}
.creator{font-size:13px;margin-bottom:8px}
.creator a{color:var(--accent);text-decoration:none;font-weight:600}
.desc{white-space:pre-wrap;color:#c3c8d4;font-size:13px;max-height:220px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.by{font-size:11.5px;color:var(--dim)} .by a{color:var(--dim)} .by a:hover{color:var(--accent)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.rec{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px}
.rec.top{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.rh{display:flex;gap:14px;align-items:center}
.score{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:800;flex:none}
.rh h3{margin:0;font-size:17px} .rh .sub{padding:0}
.verdict{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.fac{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin-top:6px}
.fac .m{height:6px;background:#232836;border-radius:4px;overflow:hidden}.fac .m i{display:block;height:100%}
.why{margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.why li{padding:3px 0}
.btn{margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;font:inherit;font-size:13px}
.study{font-size:12.5px;color:var(--dim);margin-top:10px}.study a{color:var(--text)}
.idea{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.idea.top{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.art{display:flex;gap:14px;margin:6px 0 16px;flex-wrap:wrap;align-items:flex-start}
.art canvas{border-radius:12px;border:1px solid var(--line);display:block;background:#000}
.art .thumb{width:100%;aspect-ratio:16/9}
.artcol.wide{width:560px;max-width:100%}
.art .icon{width:180px;height:180px}
.artcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.small{background:#232836;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.small:hover{border-color:var(--accent)}
pre.gdesc{white-space:pre-wrap;font:13px/1.5 -apple-system,Helvetica,Arial,sans-serif;margin:0 0 8px;background:#0f121a;border-radius:8px;padding:10px 12px;max-height:260px;overflow:auto}
.idea h3{margin:4px 0 6px;font-size:26px;letter-spacing:-.4px}
.idea .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gold)}
.idea .pitch{color:#c3c8d4;font-size:14px;margin:0 0 14px}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.igrid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.box p{margin:0 0 8px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1d2230;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px}
.chip b{color:var(--accent)}
.studies{display:flex;flex-direction:column;gap:8px}
.study-g{display:flex;align-items:center;gap:10px;font-size:13px}
.study-g img{width:40px;height:40px;border-radius:8px;background:#222}
.study-g a{color:var(--text);font-weight:600;text-decoration:none}.study-g a:hover{color:var(--accent)}
.intro{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:900px}
.chev{color:var(--dim);font-size:11px;margin-left:6px}
</style></head><body>

panied by nighttime temple music\n- Tap on your favorite fish to prevent accidental sales.\n\nRiver Hunter: A Thai-style fishing game where you hunt local bosses, build your own home, and raise fish in your personal tanks.\n\nWhat's in the game\n- Various fishing rods: For striking artificial bait, targeting shallow water fish, bottom feeders, and jigging. Features a wide selection of reels, lines, and baits.\n- Many types of Thai fish have rare colors, giant sizes, and dedicated fish collection books.\n- Large local bosses in each zone. Engage in long battles and compete for the fastest records throughout the game.\n- Build a house, decorate it, dig a dirt pond, set up an aquarium, and rebirth to upgrade your house and unlock new areas.\n- Drive cars, ride boats, ride elephants, and go fishing acros", "creator": "Mitangsuangchin", "creatorUrl": "https://www.roblox.com/users/6105713161/profile"}, "10769256110": {"name": "\ud83d\udea8SWAT: Elite Force ", "ccu": 6135, "icon": "https://tr.rbxcdn.com/180DAY-9f4366e4b1c6b4d5c8658f7af91fce12/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/102972365566319", "ch3": -6.5, "ch24": 74.9, "created": "2026-10-04", "isNew": true, "genre": "Simulation", "niches": [], "banner": "https://tr.rbxcdn.com/180DAY-db5cae8a64a90e5f8dc131e2b3442d43/768/432/Image/Png/noFilter", "desc": "\ud83d\udea8 SWAT Simulator\n\nStep into the boots of an elite SWAT officer in an intense tactical police simulator! Take on high-risk missions, respond to dangerous threats, and lead your team through thrilling operations. Raid hostile buildings, rescue hostages, stop criminals, and secure dangerous locations in an action-packed SWAT experience.\n\n\ud83d\udc6e How To Play:\n- Join the game and choose your gear and weapons from the locker.\n- Head to a mission pad to begin your operation.\n- Follow objectives, clear rooms, and neutralize hostile suspects.\n- Complete missions to earn rewards and become an elite SWAT operator.\n\u2b50 Expect yriagone", "creatorUrl": "https://www.roblox.com/users/24684163/profile"}, "10769969117": {"name": "Low Range: Offroad 4x4 [EARLY ACCESS]", "ccu": 7894, "icon": "https://tr.rbxcdn.com/180DAY-38d19ee1752482ae08b9665d7c2171f5/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/88131802740480", "ch3": 89.9, "ch24": 79.3, "created": "2026-10-09", "isNew": true, "genre": "Vehicle Sim", "niches": [], "banner": "https://tr.rbxcdn.com/180DAY-d2c3581d526d4e2214b18f71eda0fc2d/768/432/Image/Png/noFilter", "desc": "Get stuck. Get winched out. Make it to the top.\nDrive real offroad trails from Australia and the USA in trucks that sink, slide, bend and break. Solo or with friends.\n\n\ud83d\uddfa\ufe0f THE TRAILS - 12 stages\n- Rubicon Trail, USA: granite slabs and boulder steps\n- Munja Track, the Kimberley: red dirt and deep river fords\n- Billy Goat Bluff, Victoria: one of the steepest climbs in Australia\n- Pyengana Jeep Track, Tasmania: thick forest mud\n\n\ud83d\udd27 THE TRUCK IS THE GAME\n- Air down your tyres, lock the diffs, drop into low range\n- Mud that remembers: ruts get deeper with every truck on the server\n- Winch off a tree or a friend's bumper\n- Dent it, pop a tyre, run out of fuel: fuel caches are your checkpoints\n- 10 trucks, from old utes to big expedition wagons\n\n\ud83d\udcf1 Play on phone, tablet, PC or controller\n\n\ud83d\udea7 Early access: new trails and trucks are on the way.\n", "creator": "MTBAce Studios", "creatorUrl": "https://www.roblox.com/communities/7429170"}, "9534705677": {"name": "[\ud83e\udd83BLACKFRIDAY] Sniper Arena", "ccu": 8688, "icon": "https://tr.rbxcdn.com/180DAY-6a17037c84845b374c57d79e480a73bd/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/122446657157717", "ch3": 78.3, "ch24": 25.6, "created": "2026-01-10", "isNew": false, "genre": "Deathmatch Shooter", "niches": ["Battlegrounds / Fighting", "Shooter / FPS"], "banner": "https://tr.rbxcdn.com/180DAY-153757956264a4369f567549a4260eae/768/432/Im d watch a dummy go through the windshield\n\n\u2694\ufe0f NPC WARS\nPick the teams, hand out weapons, press go\n\n\ud83c\udf0d WORLD EVENTS\nNuke, Black Hole, Fire Storm, Zero-G, Flash Freeze\n\n\ud83d\udee0\ufe0f SANDBOX\nSpawn anything, bend the rules, slow time down, rewind it\n\n\ud83c\udfae Play on PC, phone and console. \u2b50 Like and favorite for updates!", "creator": "blablablablabla123123", "creatorUrl": "https://www.roblox.com/communities/91569202"}, "8546873728": {"name": "(UTTV + MORE) Apocalyptic Titans Roleplay", "ccu": 5395, "icon": "https://tr.rbxcdn.com/180DAY-29b5b09bd55ffe9d2248c5f738c713ec/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/102917792916356", "ch3": 11.3, "ch24": 48.1, "created": "2025-08-25", "isNew": false, "genre": "Morph Roleplay", "niches": ["Roleplay / Life / City"], "banner": "https://tr.rbxcdn.com/180DAY-0ae8b5163885e70abad6ee5de0458001/768/432/Image/Png/noFilter", "desc": "A roleplay experience based on the ST series.\nWe feature content from all eras of the show so you can roleplay however you want with your favourite characters.\nAll canon characters from the show are free.\nSome custom characters are gamepass morphs so we can pay the developers, but they are free in private servers!\nConsider trying our game!\n\n-To use free fly, type ;fly in the chat\n\nDo not participate in ANY form of innapropriate activity/roleplay in this game, players have a right to report you directly to me and the offender will be permanently banned from this game.\n\nDeveloper Credits: Proteus, overl1ghter, boryaburtsev, Billy, krolik22100, Gecko, JC, NobleJohn, ScottRBLX, CDR, Mysterio.\n\nContributor Credits: Mcnugget, LittleMan, Fede, Massivehit, MrFancyDino, Epicyes, Peanut, HappyBacon, Akuto, RM, Hooda, Leo, LorDoctor.\n\nCredits to Nocapsfm for Scientist rip in half move inspiration.", "creator": "Apocalyptic RP Community", "creatorUrl": "https://www.roblox.com/communities/35160489"}, "3990106548": {"name": "[\ud83e\udd83 p with fellow Toons to complete machines and descend deeper into Gardenview Center.\n\n\u2727---\u2727\nAre you ready to 'See A Very Exciting and Unforgettable Show'? Look no further as Dandy and the Gardenview Crew are ready to give you a performance you don't want to miss!\n\n(\u26a0\ufe0f DISCLAIMER: Experience may include bright/flashing lights and may affect photosensitive users. \u26a0\ufe0f)\n(\u26a0\ufe0f BUGS: Report any bugs you find to the BlushCrunch Studio Server! \u26a0\ufe0f)\n\n\u2727---\u2727\n\ud83c\udf3b - Collect Toons with unique stats and abilities!\n\ud83e\udee7 - Complete Machines and collect Research on what lurks below...\n\ud83d\udce6 - Collect Trinkets to customize your playstyle!\n\n\u2727---\u2727\nVERSION 1.0.5\n\ud83e\uddea The Labs Are here! New Game Mode with 11 Floors!\n\ud83d\udd0c 2 new OA Toons, Dessa & Dioda!\n\ud83c\udf08 New premium Rainbow-Time Bundle!\n\ud83d\udcac Thousands of lines of new lore and dialogue!", "creator": "BlushCrunch Studio", "creatorUrl": "https://www.roblox.com/communities/14576965"}, "10774303559": {"name": "Fish for Secret Animals!", "ccu": 29435, "icon": "https://tr.rbxcdn.com/180DAY-e4e0a5b4adad068894ddfe1881c8af0e/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/107192230357786", "ch3": 64.0, "ch24": 54.8, "created": "2026-11-02", "isNew": true, "genre": "Tycoon", "niches": ["Fishing"], "banner": "https://tr.rbxcdn.com/180DAY-3fd60eeae5c99c4223b7ba9cd430bec2/768/432/Image/Png/noFilter", "desc": "****Originally Catch Rare Fish, name has been changed****\n\n\ud83c\udfa3 **Welcome to Fish for Secret Animals** \ud83e\udd88\n\n\ud83c\udf0a Cast your line across different biomes!\n\n\ud83d\udc1f Catch rare fish and massive sea beasts!\n\n\u2728 Discover crazy mutations and legendary catches!\n\n\ud83d\udcb0 Sell your catches, upgrade your gear, and boost your luck!\n\nLike and favorite to never miss out on updates!", "creator": "Chill Shark", "creatorUrl": "https://www.roblox.com/communit e in settings\n\n\u270c\ufe0f Easy", "creator": "Easy.gg", "creatorUrl": "https://www.roblox.com/communities/5774246"}, "10776778943": {"name": "Superpower Ragdoll Physics \ud83e\ude78", "ccu": 9000, "icon": "https://tr.rbxcdn.com/180DAY-cfc91826ae57a85d6d1b93accc6729c1/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/93605461718772", "ch3": -19.4, "ch24": 48.4, "created": "2026-11-15", "isNew": true, "genre": "Physics Sim", "niches": [], "banner": "https://tr.rbxcdn.com/180DAY-e1c8fcadd6f9d8b7d65ddbe4c3f3ae0e/768/432/Image/Png/noFilter", "desc": "\ud83d\udca5 Every person is a real physics body. Punch them, throw them, blast them across the map and watch what happens.\n\nThey stumble, wince and fall the way they were hit. Big hits flash an x-ray, a doctor runs in with bandages, and a grave rises for the ones who didn't make it.\n\n\u26a1 36 SUPERPOWERS\nLaser eyes, telekinesis, thunder clap, web swing, time stop, tornado, giant mode, meteor strike and a nuke\n\n\ud83e\uddb9 6 VILLAINS\nBrute smashes, Pyro sets people on fire, Speedster runs them down. Stop them, or don't\n\n\ud83c\udfac 9 SCENARIOS\nPrison break, bank heist, hostage rescue, outbreak, lab escape and a full frontline\n\n\ud83c\udf0d 15 WORLD EVENTS\nT-Rex rampage, shark rain, tsunami, airstrike, bee swarm, giant dummy and a disco party\n\n\ud83d\uddfa\ufe0f 7 MAPS\nCity, construction site, playground, forest, stadium and a clean white room\n\n\ud83d\udc65 PLAY WITH FRIENDS\nFly together, slow time down and wreck the city as a team\n\n\ud83c\udfae Play on PC, phone, console and VR. \u2b50 Like and favorite for updates!", "creator": "SuperheroCCU", "creatorUrl": "https://www.roblox.com/communities/496803787"}, "10775599302": {"name": "Draw Your Cart!", "ccu": 17827, "icon": "https://tr.rbxcdn.com/180DAY-7a2aac9c5297135fb16da9a4d2b256b1/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/96040168895349", "ch3": -5.8, "ch24": 47.3, "created": "2026-11-09", "isNew": true, "g ccess and gets new spots and bikes regularly. Found a bug? Let us know!", "creator": "Lucky Upward Games", "creatorUrl": "https://www.roblox.com/communities/597678069"}, "10778869268": {"name": "The Great Build", "ccu": 23603, "icon": "https://tr.rbxcdn.com/180DAY-4a2939a63d0bf21a2fd08d1cb8331775/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/98487757108234", "ch3": -7.9, "ch24": -17.7, "created": "2026-11-24", "isNew": true, "genre": "Showcase & Hub", "niches": [], "banner": "https://tr.rbxcdn.com/180DAY-d276059e31445c0cad70c985dbae4806/768/432/Image/Png/noFilter", "desc": "What can we build when everyone shares a little gratitude? Spoiler: something very, very tall.\n\nOur community is what makes Roblox, Roblox. So from November 25 to 30, we\u2019re giving everyone a chance to express what they\u2019re grateful for. Every message of gratitude becomes a block in one giant tower built by players all over the world.\n\nHere's the plan:\n\ud83e\uddf1 Grab your free block. A fresh one drops every hour.\n\ud83e\uddf1 Pick your message of gratitude. Choose what you're grateful for, from everyday things to your favorite influencers, and how you want to say it. Your username goes on it.\n\ud83e\uddf1 Send it up. Your block finds its spot in the tower, and up it goes.\n\ud83e\uddf1 Explore the tower and see what everyone else is grateful for.\n\ud83e\uddf1 Unlock free UGC together as the tower hits new milestones.\n\nCome back every hour to add another message and see how high it's gone.\n\nWe\u2019ll see you at the top.", "creator": "Roblox Presents", "creatorUrl": "https://www.roblox.com/communities/4111519"}, "5203828273": {"name": "[\ud83e\udd83SALE] Dress To Impress", "ccu": 51131, "icon": "https://tr.rbxcdn.com/180DAY-daa1d38bb3d80b8712b78b236f194b3d/150/150/Image/Png/noFilter", "url": "https://www.roblox.com/games/15101393044", "ch3": -25.6, "ch24": 11.7, "created": "2023-10-18", "isNew": false, "genre": "Dress Up", "niches": ["Dress Up / Fashion"] function spark(arr){
  const v=arr.filter(x=>x!=null);if(v.length<2)return'';
  const w=70,h=24,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-2-(y-mn)/r*(h-4)).toFixed(1)}`).join(' ');
  const c=v[v.length-1]>=v[0]?'#2fd47a':'#ff5d6c';
  return `<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="1.8" points="${pts}"/></svg>`;
}

function drawArt(c,d,square){
  const x=c.getContext('2d'),W=c.width,H=c.height,h=d.hue;
  let seed=[...d.title].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7);
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const g=x.createRadialGradient(W*.55,H*.45,10,W*.5,H*.5,Math.max(W,H)*.8);
  g.addColorStop(0,`hsl(${h},90%,62%)`);g.addColorStop(.55,`hsl(${(h+25)%360},80%,40%)`);g.addColorStop(1,`hsl(${(h+50)%360},75%,16%)`);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // sunburst
  x.save();x.translate(W*.6,H*.45);x.fillStyle='rgba(255,255,255,.07)';
  for(let k=0;k<18;k++){x.rotate(Math.PI*2/18);x.beginPath();x.moveTo(0,0);x.lineTo(W,-W*.09);x.lineTo(W,W*.09);x.closePath();x.fill()}
  x.restore();
  const emo=s=>`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.textAlign='center';x.textBaseline='middle';
  // sparkles
  for(let k=0;k<(square?5:9);k++){x.globalAlpha=.55+rnd()*.4;x.font=emo(H*(.05+rnd()*.06));x.fillText('✨',rnd()*W,rnd()*H)}
  x.globalAlpha=1;x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=H*.04;x.shadowOffsetY=H*.015;
  if(square){x.font=emo(H*.5);x.fillText(d.emoji[0],W*.5,H*.42);x.font=emo(H*.26);x.fillText(d.emoji[1],W*.78,H*.72)}
  else{x.font=emo(H*.48);x.fillText(d.emoji[0],W*.74,H*.5);x.font=emo(H*.24);x.fillText(d.emoji[1],W*.9,H*.78)}
  x.shadowBlur=0;x.shadowOffsetY=0;
  // title
  const words=d.title.toUpperCase().split(' '),maxW=square?W*.9:W*.6;
  let lines=[],size=square?H*.16:H*.2;
  const fit=()=>{x.font=`900 ${size}px "Arial Black","Helvetica Neue",Impact,sans-serif`;lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}lines.push(cur)};
  fit();while((lines.length>(square?2:3)||lines.some(l=>x.measureText(l).width>maxW))&&size>14){size*=.92;fit()}
  const cx=square?W*.5:W*.34,lh=size*1.05,y0=square?H*.8-(lines.length-1)*lh/2:H*.5-(lines.length-1)*lh/2;
  lines.forEach((l,k)=>{const y=y0+k*lh;
    x.lineJoin='round';x.lineWidth=size*.22;x.strokeStyle='#111';x.strokeText(l,cx,y);
    const tg=x.createLinearGradient(0,y-size/2,0,y+size/2);tg.addColorStop(0,'#fff9d6');tg.addColorStop(.5,'#ffd23f');tg.addColorStop(1,'#ff9f1c');
    x.fillStyle=tg;x.fillText(l,cx,y)});
  // NEW badge
  if(!square){x.save();x.translate(W*.1,H*.12);x.rotate(-.18);x.fillStyle='#ff2e4d';const bw=W*.13,bh=H*.1;
    x.beginPath();x.roundRect(-bw/2,-bh/2,bw,bh,bh*.3);x.fill();x.lineWidth=H*.008;x.strokeStyle='#fff';x.stroke();
    x.fillStyle='#fff';x.font=`900 ${bh*.6}px "Arial Black",Impact,sans-serif`;x.fillText('NEW!',0,bh*.04);x.restore()}
}

  const span=D.span7>=150?'the past week':(D.span7?`the last ${D.span7} hours (a full week of data builds up over 7 days)`:'nothing yet (growth shows up after the next update)');
  el.innerHTML=`<div class="dh"><div><div class="kind">Recommendations</div><h2>Best niches to build a game in right now</h2></div></div>
  <p class="intro">Each niche and name trend gets a score out of 100 from: <b>growth</b> over ${span} (35%), <b>player loyalty</b>, meaning likes, favorites and how steady the player count is (25%), <b>room for new games</b>, meaning whether new games are succeeding and whether one game dominates (25%), and <b>size</b>, the average players per game (15%). It's a guide built from public data, not a guarantee. Make your own original take on the niche.</p>
  <div class="recs">${rs.map((r,i)=>{
    const study=r.ids.find(id=>D.games[id].isNew)||r.ids[0],sg=D.games[study];
    return `<div class="rec ${i==0?'top':''}">
    <div class="rh"><div class="score" style="border:3px solid ${col(r.score)};color:${col(r.score)}">${r.score}</div>
     <div><h3>${i+1}. ${esc(r.label)}<span class="verdict" style="background:${col(r.score)}22;color:${col(r.score)}">${r.verdict}</span></h3>
     <div class="sub">${r.kind=='niche'?'Niche':'Name trend'} · ${fmt(r.ccu)} CCU · ${r.count} games · week ${chg(r.ch7)}</div></div></div>
    ${Object.entries(r.factors).map(([k,v])=>`<div class="fac"><span>${k}</span><span class="m"><i style="width:${v}%;background:${col(v)}"></i></span><span>${v}</span></div>`).join('')}
    <ul class="why">${r.why.map(w=>`<li>✅ ${esc(w)}</li>`).join('')}${r.warn.map(w=>`<li>⚠️ ${esc(w)}</li>`).join('')}</ul>
    <div class="study">Game to study: <a href="${sg.url}" target="_blank">${esc(sg.name)}</a> (${fmt(sg.ccu)} CCU${sg.isNew?', new':''})</div>
    <button class="btn" data-l="${esc(r.label)}" data-k="${r.kind}">See all ${r.count} games →</button></div>`}).join('')||'<div class="empty">Not enough data yet.</div>'}</div>`;
  el.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
    sel=D.groups.find(g=>g.label==b.dataset.l&&g.kind==b.dataset.k);document.getElementById('q').value='';setTab(b.dataset.k,true)});
}
document.getElementById('q').oninput=()=>{sel=null;renderList()};
document.getElementById('sort').onchange=renderList;
setTab('ideas');
</script></body></html>
